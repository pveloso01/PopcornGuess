[pytest]
python_files = tests.py test_*.py *_test.py
python_classes = Test*
python_functions = test_*
; Coverage gate at 90% — raise as the suite grows.
addopts = --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=90 --cov-config=pytest.ini
testpaths = .
DJANGO_SETTINGS_MODULE = popcornguess.settings_test

[coverage:run]
omit =
    */migrations/*
    */tests.py
    */test_*.py
    *_test.py
    */venv/*
    */.venv/*
    manage.py
    */settings.py
    */settings_test.py
    */wsgi.py
    */asgi.py
    */urls.py
    */integrations/*
    */management/commands/*
