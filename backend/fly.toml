# Fly.io deployment configuration for PopcornGuess backend (Django).
#
# This config targets the free tier:
#   - 1 shared-cpu-1x machine, 256 MB RAM
#   - auto_stop_machines + min_machines_running=0 = scale to zero overnight
#
# Replace `app = "popcornguess-api"` with whatever you reserve via
# `fly apps create`. Region should be the closest free-tier region.

app = "popcornguess-api"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DEBUG = "False"
  WEB_CONCURRENCY = "2"
  PYTHONUNBUFFERED = "1"

[deploy]
  # Run migrations on every deploy. Idempotent and cheap.
  release_command = "python manage.py migrate --noinput"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health/"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
