# Local-only port override.
#
# Docker Desktop was holding stale allocations on host ports 3000 and
# 8000 after a daemon restart. Using `!override` so the base file's
# port list is fully replaced, not merged.
# Safe to delete — has no effect on Fly/Vercel deploys.
services:
  backend:
    ports: !override
      - "8001:8000"
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:3001,http://127.0.0.1:3001
  frontend:
    ports: !override
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api/v1
