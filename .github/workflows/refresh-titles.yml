name: Refresh title autocomplete pool

on:
  schedule:
    # Weekly Monday 02:00 UTC — keeps the autocomplete pool fresh with
    # newly popular titles without exhausting the TMDb daily quota.
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      pages:
        description: 'TMDb pages per kind (20 titles each).'
        required: false
        default: '15'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          PAGES="${{ github.event.inputs.pages || '15' }}"
          flyctl ssh console -a "${{ vars.FLY_APP_NAME }}" \
            -C "python manage.py import_titles --pages $PAGES --kinds movie,tv"
