name: Nightly database backup

on:
  schedule:
    # 04:00 UTC — keeps a rolling 30-day pg_dump of Neon as encrypted
    # GitHub release artifacts. Free, no S3 needed.
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client age
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -e
          STAMP=$(date -u +%Y%m%d-%H%M)
          mkdir -p backups
          pg_dump --no-owner --no-acl --format=custom \
            "$DATABASE_URL" > "backups/popcornguess-$STAMP.dump"
          # Encrypt with the operator's age public key.
          age -r "$BACKUP_AGE_RECIPIENT" -o "backups/popcornguess-$STAMP.dump.age" \
            "backups/popcornguess-$STAMP.dump"
          rm "backups/popcornguess-$STAMP.dump"
          ls -lh backups/
          echo "BACKUP_FILE=backups/popcornguess-$STAMP.dump.age" >> $GITHUB_ENV
          echo "BACKUP_TAG=db-backup-$STAMP" >> $GITHUB_ENV
      - name: Publish as release artifact
        uses: softprops/action-gh-release@v2
        with:
          name: 'DB backup ${{ env.BACKUP_TAG }}'
          tag_name: ${{ env.BACKUP_TAG }}
          files: ${{ env.BACKUP_FILE }}
          draft: false
          prerelease: true
          generate_release_notes: false
      - name: Prune old backup releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 30
          delete_tag_pattern: 'db-backup-'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
