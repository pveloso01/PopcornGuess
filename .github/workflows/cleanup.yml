name: Cleanup stale anonymous users

on:
  schedule:
    # Weekly Sunday 03:00 UTC — purge anonymous shells inactive > 90 days
    # whose progress was never migrated to a real account. Frees Neon
    # rows on the free tier.
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console -a "${{ vars.FLY_APP_NAME }}" \
            -C "python manage.py cleanup_anonymous_users --days 90"
