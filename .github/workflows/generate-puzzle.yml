name: Generate daily puzzle

on:
  schedule:
    # 00:30 UTC every day — well before our 00:00 UTC daily rollover, so
    # the puzzle is in place by the time the rollover triggers on the
    # client side. This generates `tomorrow`.
    - cron: '30 0 * * *'
    # 23:00 UTC every day — hot-spare run. Generates `now+2` to keep a
    # one-day buffer ahead of the primary 00:30 UTC job. If the primary
    # job fails the next morning, we've already produced what was
    # "tomorrow" at 23:00 the previous day.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Override target date (YYYY-MM-DD). Empty = tomorrow.'
        required: false
        default: ''
      dry_run:
        description: 'Dry-run only — generate but do not write.'
        type: boolean
        default: false

jobs:
  generate:
    name: Run generate_daily_puzzle on Fly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build flyctl args
        id: args
        run: |
          ARGS=""
          # The 23:00 UTC schedule targets `now+2` (the hot-spare slot).
          # The 00:30 UTC schedule leaves --date empty, letting the
          # command default to `tomorrow`.
          if [ "${{ github.event.schedule }}" = "0 23 * * *" ]; then
            TARGET=$(date -u -d "+2 days" +%Y-%m-%d)
            ARGS="--date $TARGET"
          fi
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.target_date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "flyargs=$ARGS" >> $GITHUB_OUTPUT
      - name: Run generator
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          flyctl ssh console -a "${{ vars.FLY_APP_NAME }}" \
            -C "python manage.py generate_daily_puzzle ${{ steps.args.outputs.flyargs }}"
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const schedule = '${{ github.event.schedule }}';
            const slot = schedule === '0 23 * * *' ? 'hot-spare (now+2)' : 'primary (tomorrow)';
            const target = '${{ github.event.inputs.target_date }}' || slot;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily puzzle generation failed (${target})`,
              labels: ['puzzle-error', 'urgent'],
              body: [
                'The scheduled puzzle generator failed.',
                '',
                `Target: \`${target}\``,
                `Schedule: \`${schedule || 'manual'}\``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Recovery options:',
                '1. Re-run the workflow manually (Actions → Generate daily puzzle → Run workflow).',
                '2. POST a hand-crafted ladder to `/api/v1/quizzes/admin/seed/` with the service token.',
                '3. SSH into Fly and run `python manage.py generate_daily_puzzle --tmdb-id <id>`.',
                '4. SSH into Fly and run `python manage.py backfill_daily_puzzles --days 7` to backfill.',
                '5. Check Gemini, TMDb, OMDb, and Wikidata quota / status.',
              ].join('\n'),
            });
